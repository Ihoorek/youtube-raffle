<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>Winners!</h1>
    <ul>
        <li th:each="entry : ${winners}">
            <b th:text="${entry.key}"></b>:
            <span th:text="${entry.value}"></span>
        </li>
    </ul>
    <a href="/youtube">Return</a>
</div>
</body>
</html>
